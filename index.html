<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordFission | Dictionary App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero-icon">📖</div>
      <div>
        <h1><a href="index.html" class="brand-link">WordFission</a></h1>
        <p>Discover meanings, pronunciation, etymology, and examples for any word</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light dark mode">🌙 Dark</button>
    </header>

    <main class="content">
      <section class="search-panel">
        <label for="search-input" class="visually-hidden">Search for any word</label>
        <div class="search-container">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input id="search-input" type="text" placeholder="Search for any word..." autocomplete="off" />
            <button id="search-button">Search</button>
          </div>
          <div class="suggestions-panel" id="suggestions-panel" aria-live="polite"></div>
        </div>
      </section>

      <div class="main-layout">
        <section class="output-panel" id="output-panel">
          <div class="output-empty">
            <p>Search for a word to see definitions, pronunciation, and examples.</p>
          </div>
        </section>
      </div>

      <div class="bottom-layout">
        <section class="bottom-section" id="recent-section">
          <h3>Recent Searches</h3>
          <div class="recent-list" id="recent-list">
            <p class="sidebar-empty">No recent searches</p>
          </div>
        </section>

        <section class="bottom-section" id="favorites-section">
          <h3>Bookmarked Words</h3>
          <div class="favorites-list" id="favorites-list">
            <p class="sidebar-empty">No bookmarked words</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <p>© 2025 WordFission. Enhance your vocabulary every day.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
